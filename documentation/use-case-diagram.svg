<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1060" width="920" height="1060">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0008"/></filter>
    <filter id="sh2"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0006"/></filter>
    <linearGradient id="g-actor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="g-auth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/><stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="g-game" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/><stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="g-cpu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/><stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="g-stat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/><stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Page background -->
  <rect width="920" height="1060" fill="#F1F5F9"/>
  <rect x="30" y="20" width="860" height="1020" rx="18" fill="#FAFCFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- System boundary -->
  <rect x="195" y="48" width="590" height="960" rx="14"
        fill="white" fill-opacity="0.7" stroke="#94A3B8"
        stroke-width="1.5" stroke-dasharray="10 6"/>
  <text x="490" y="76" font-family="Segoe UI,Inter,Arial,sans-serif"
        font-size="12" font-weight="600" fill="#94A3B8"
        letter-spacing="1" text-anchor="middle">TIC TAC TOE SYSTEM</text>

  <!-- ───── ACTORS ───── -->
  <g id="Actor-Anonymous" filter="url(#sh2)">
    <rect x="44" y="144" width="114" height="46" rx="23" fill="url(#g-actor)"/>
    <text x="101" y="163" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="12" font-weight="700" fill="white" text-anchor="middle">Anonymous</text>
    <text x="101" y="181" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="10.5" fill="#94A3B8" text-anchor="middle">User</text>
  </g>

  <g id="Actor-Registered" filter="url(#sh2)">
    <rect x="40" y="527" width="122" height="50" rx="25" fill="url(#g-actor)"/>
    <text x="101" y="547" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="12" font-weight="700" fill="white" text-anchor="middle">Registered</text>
    <text x="101" y="565" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="12" font-weight="700" fill="white" text-anchor="middle">User</text>
  </g>

  <g id="Actor-SystemAI" filter="url(#sh2)">
    <rect x="834" y="643" width="90" height="46" rx="23" fill="url(#g-actor)"/>
    <text x="879" y="662" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="12" font-weight="700" fill="white" text-anchor="middle">System</text>
    <text x="879" y="679" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="10.5" fill="#94A3B8" text-anchor="middle">(AI)</text>
  </g>

  <!-- ───── USE CASES ───── -->

  <g id="UC01-Register" filter="url(#sh)">
    <ellipse cx="460" cy="167" rx="140" ry="34" fill="url(#g-auth)"/>
    <text x="460" y="162" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="15" font-weight="700" fill="white" text-anchor="middle">Register</text>
    <text x="460" y="181" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="10.5" fill="#93C5FD" text-anchor="middle">UC-01</text>
  </g>

  <g id="UC02-Login" filter="url(#sh)">
    <ellipse cx="460" cy="272" rx="140" ry="34" fill="url(#g-auth)"/>
    <text x="460" y="267" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="15" font-weight="700" fill="white" text-anchor="middle">Login</text>
    <text x="460" y="286" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="10.5" fill="#93C5FD" text-anchor="middle">UC-02</text>
  </g>

  <g id="UC03-CreatePvP" filter="url(#sh)">
    <ellipse cx="460" cy="372" rx="140" ry="34" fill="url(#g-game)"/>
    <text x="460" y="367" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="15" font-weight="700" fill="white" text-anchor="middle">Create PvP Game</text>
    <text x="460" y="386" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="10.5" fill="#6EE7B7" text-anchor="middle">UC-03</text>
  </g>

  <g id="UC04-JoinPvP" filter="url(#sh)">
    <ellipse cx="460" cy="467" rx="140" ry="34" fill="url(#g-game)"/>
    <text x="460" y="462" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="15" font-weight="700" fill="white" text-anchor="middle">Join PvP Game</text>
    <text x="460" y="481" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="10.5" fill="#6EE7B7" text-anchor="middle">UC-04</text>
  </g>

  <g id="UC05-CreateCPU" filter="url(#sh)">
    <ellipse cx="460" cy="562" rx="140" ry="34" fill="url(#g-play)"/>
    <text x="460" y="557" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="15" font-weight="700" fill="white" text-anchor="middle">Create CPU Game</text>
    <text x="460" y="576" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="10.5" fill="#C4B5FD" text-anchor="middle">UC-05</text>
  </g>

  <g id="UC06-MakeMove" filter="url(#sh)">
    <ellipse cx="415" cy="660" rx="120" ry="34" fill="url(#g-play)"/>
    <text x="415" y="655" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="15" font-weight="700" fill="white" text-anchor="middle">Make Move</text>
    <text x="415" y="674" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="10.5" fill="#C4B5FD" text-anchor="middle">UC-06</text>
  </g>

  <g id="UC07-CPUResponds" filter="url(#sh)">
    <ellipse cx="660" cy="660" rx="118" ry="34" fill="url(#g-cpu)"/>
    <text x="660" y="655" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="15" font-weight="700" fill="white" text-anchor="middle">CPU Responds</text>
    <text x="660" y="674" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="10.5" fill="#FCD34D" text-anchor="middle">UC-07</text>
  </g>

  <g id="UC08-UndoMove" filter="url(#sh)">
    <ellipse cx="460" cy="758" rx="140" ry="34" fill="url(#g-play)"/>
    <text x="460" y="753" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="15" font-weight="700" fill="white" text-anchor="middle">Undo Move</text>
    <text x="460" y="772" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="10.5" fill="#C4B5FD" text-anchor="middle">UC-08</text>
  </g>

  <g id="UC09-Leaderboard" filter="url(#sh)">
    <ellipse cx="460" cy="853" rx="140" ry="34" fill="url(#g-stat)"/>
    <text x="460" y="848" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="15" font-weight="700" fill="white" text-anchor="middle">View Leaderboard</text>
    <text x="460" y="867" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="10.5" fill="#86EFAC" text-anchor="middle">UC-09</text>
  </g>

  <g id="UC10-Logout" filter="url(#sh)">
    <ellipse cx="460" cy="948" rx="140" ry="34" fill="url(#g-auth)"/>
    <text x="460" y="943" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="15" font-weight="700" fill="white" text-anchor="middle">Logout</text>
    <text x="460" y="962" font-family="Segoe UI,Inter,Arial,sans-serif"
          font-size="10.5" fill="#93C5FD" text-anchor="middle">UC-10</text>
  </g>

  <!-- ───── ASSOCIATION LINES ───── -->

  <!-- Anonymous → UC-01 (horizontal) -->
  <line x1="158" y1="167" x2="320" y2="167"
        stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Anonymous → UC-02 (down then right) -->
  <path d="M 158,167 L 158,272 L 320,272"
        fill="none" stroke="#94A3B8" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Registered User: connect to spine -->
  <line x1="162" y1="552" x2="165" y2="552"
        stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Spine: vertical from y=272 to y=948 at x=165 -->
  <line x1="165" y1="272" x2="165" y2="948"
        stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Horizontal branches from spine to each UC -->
  <line x1="165" y1="272" x2="320" y2="272" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="165" y1="372" x2="320" y2="372" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="165" y1="467" x2="320" y2="467" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="165" y1="562" x2="320" y2="562" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="165" y1="660" x2="295" y2="660" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="165" y1="758" x2="320" y2="758" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="165" y1="853" x2="320" y2="853" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="165" y1="948" x2="320" y2="948" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- UC-06 → UC-07 «triggers» dashed arrow -->
  <line x1="535" y1="660" x2="542" y2="660"
        fill="none" stroke="#64748B" stroke-width="1.4"
        stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="538" y="651" font-family="Segoe UI,Inter,Arial,sans-serif"
        font-size="9.5" fill="#64748B" text-anchor="middle">«triggers»</text>

  <!-- System AI → UC-07 -->
  <line x1="834" y1="666" x2="778" y2="660"
        stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- ───── LEGEND ───── -->
  <g id="Legend">
    <rect x="200" y="1020" width="580" height="26" rx="8"
          fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="214" y="1027" width="11" height="11" rx="3" fill="#2563EB"/>
    <text x="231" y="1037" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="10" fill="#64748B">Auth</text>
    <rect x="268" y="1027" width="11" height="11" rx="3" fill="#059669"/>
    <text x="285" y="1037" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="10" fill="#64748B">Game Mgmt</text>
    <rect x="355" y="1027" width="11" height="11" rx="3" fill="#7C3AED"/>
    <text x="372" y="1037" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="10" fill="#64748B">Gameplay</text>
    <rect x="432" y="1027" width="11" height="11" rx="3" fill="#D97706"/>
    <text x="449" y="1037" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="10" fill="#64748B">AI / CPU</text>
    <rect x="498" y="1027" width="11" height="11" rx="3" fill="#16A34A"/>
    <text x="515" y="1037" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="10" fill="#64748B">Statistics</text>
    <line x1="562" y1="1032" x2="592" y2="1032" stroke="#64748B" stroke-width="1.3"
          stroke-dasharray="5 3" marker-end="url(#arr)"/>
    <text x="598" y="1037" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="10" fill="#64748B">«triggers»</text>
    <rect x="662" y="1027" width="11" height="11" rx="3" fill="#1E293B"/>
    <text x="679" y="1037" font-family="Segoe UI,Inter,Arial,sans-serif" font-size="10" fill="#64748B">Actor</text>
  </g>

</svg>
